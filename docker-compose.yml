services:
  db:
    image: postgres:16-alpine
    container_name: idol-postgres
    restart: always
    environment:
      POSTGRES_USER: idol
      POSTGRES_PASSWORD: idol_secret
      POSTGRES_DB: idol_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idol -d idol_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
