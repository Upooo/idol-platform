services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idol
      POSTGRES_PASSWORD: idol_secret
      POSTGRES_DB: idol_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idol -d idol_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m src.main

volumes:
  pgdata:
